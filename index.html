<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guard - Anti Arnaque</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, sans-serif; background: radial-gradient(ellipse at top, #0a1929 0%, #000308 100%); color: #e9edef; min-height: 100vh; padding: 15px; }
  .container { max-width: 500px; margin: 0 auto; }
  .header { text-align: center; padding: 15px; border: 2px solid #00ffcc; border-radius: 12px; background: rgba(0, 255, 204, 0.05); margin-bottom: 15px; }
  .header h1 { font-size: 22px; color: #00ffcc; letter-spacing: 2px; }
  .header p { font-size: 10px; color: #00ffcc; opacity: 0.7; letter-spacing: 2px; margin-top: 3px; }
  .header .version { font-size: 9px; color: #000308; background: #00ffcc; display: inline-block; padding: 2px 8px; border-radius: 5px; font-weight: bold; margin-top: 6px; }
  input[type="text"] { width: 100%; padding: 14px; border: 2px solid #00ffcc; border-radius: 10px; background: #111b21; color: #e9edef; font-size: 15px; margin-bottom: 10px; }
  button { width: 100%; padding: 16px; font-size: 16px; font-weight: bold; border: none; border-radius: 10px; cursor: pointer; background: linear-gradient(135deg, #00ffcc, #00cc99); color: #000308; margin-bottom: 10px; }
  button:active { transform: scale(0.97); }
  button.danger { background: linear-gradient(135deg, #ff3366, #cc0033); color: #fff; }
  .result { background: #111b21; border-radius: 12px; padding: 20px; margin-top: 15px; border-left: 5px solid #8696a0; }
  .result.ok { border-left-color: #00ffcc; }
  .result.warn { border-left-color: #ffaa00; }
  .result.danger { border-left-color: #ff3366; }
  .score { font-size: 40px; font-weight: bold; text-align: center; margin-bottom: 8px; color: #00ffcc; }
  .result.warn .score { color: #ffaa00; }
  .result.danger .score { color: #ff3366; }
  .verdict { text-align: center; font-size: 20px; font-weight: bold; margin-bottom: 15px; }
  .raisons { font-size: 14px; line-height: 1.8; color: #d1d7db; }
  .raisons div { padding: 6px 0; }
  .preview { background: #111b21; border-radius: 12px; padding: 15px; margin-top: 15px; border: 1px solid #00ffcc; }
  .preview h4 { color: #00ffcc; font-size: 14px; margin-bottom: 10px; }
  .shot { width: 100%; border-radius: 8px; margin-bottom: 12px; background: #222; min-height: 150px; border: 1px solid #2a3942; }
  .shot-label { font-size: 12px; color: #00ffcc; margin-bottom: 6px; display: flex; justify-content: space-between; }
  .info-box { background: rgba(0, 255, 204, 0.05); border: 1px dashed #00ffcc; border-radius: 10px; padding: 12px; font-size: 12px; color: #00ffcc; margin-bottom: 12px; line-height: 1.6; }
  .footer { text-align: center; font-size: 10px; color: #8696a0; margin-top: 20px; padding-top: 12px; border-top: 1px solid #2a3942; }
  .blocked-box { background: rgba(255, 51, 102, 0.15); border: 2px solid #ff3366; border-radius: 10px; padding: 15px; margin-top: 15px; color: #ffb3c6; font-size: 13px; line-height: 1.6; }
  .blocked-box h4 { color: #ff3366; font-size: 15px; margin-bottom: 8px; }
  .rapport { background: #1a2332; border-radius: 12px; padding: 15px; margin-top: 15px; border: 2px solid #ffaa00; }
  .rapport h4 { color: #ffaa00; font-size: 15px; margin-bottom: 10px; }
  .rapport textarea { width: 100%; min-height: 250px; padding: 12px; border-radius: 8px; background: #0a1218; color: #e9edef; font-family: monospace; font-size: 11px; line-height: 1.5; border: 1px solid #2a3942; }
  .alert { background: #00ffcc; color: #000308; padding: 15px; border-radius: 10px; text-align: center; font-weight: bold; font-size: 16px; margin-bottom: 10px; }
  .drainbot-badge { display: inline-block; padding: 3px 8px; background: rgba(0, 255, 204, 0.15); border-radius: 5px; font-size: 10px; color: #00ffcc; margin-bottom: 8px; font-weight: bold; }
</style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🛡️ GUARD</h1>
      <p>PROTECTION ANTI-ARNAQUE</p>
      <span class="version">v8.0 — DRAINBOT INTÉGRÉ</span>
    </div>

    <div class="info-box">⚠️ Colle un lien suspect. L'app l'analyse <strong>sans que ton téléphone le visite</strong>.</div>
    <input type="text" id="urlInput" placeholder="https://lien-suspect.com/..." />
    <button onclick="checkLink()">🔍 Analyser le lien</button>

    <div id="zoneResultat"></div>
    <div id="previewZone"></div>

    <div class="footer">🛡️ GUARD v8.0</div>
  </div>

<script>
  var URL_STOCKEE = '';
  var SCORE_FINAL = 0;
  var RAISONS_FINALES = [];
  var NB_IMAGES_OK = 0;
  var DRAINBOT_URL = 'https://drainbot.onrender.com/analyze?url=';

  function checkLink() {
    var url = document.getElementById('urlInput').value.trim();
    var zone = document.getElementById('zoneResultat');
    var previewZone = document.getElementById('previewZone');

    if (!url) {
      zone.innerHTML = '<div class="alert">⚠️ Colle un lien d\'abord</div>';
      return;
    }

    if (!url.startsWith('http://') && !url.startsWith('https://')) url = 'http://' + url;
    URL_STOCKEE = url;
    NB_IMAGES_OK = 0;

    zone.innerHTML = '<div class="alert">🤖 Analyse par DrainBot...</div>';
    previewZone.innerHTML = '';

    // 1. Appeler DrainBot
    fetch(DRAINBOT_URL + encodeURIComponent(url))
      .then(function(r) { return r.json(); })
      .then(function(data) {
        var raisons = [];
        var score = 0;

        if (data.error) {
          // DrainBot a échoué, on fait une analyse locale
          analyseLocale(url, zone, previewZone);
          return;
        }

        score = data.score || 0;
        raisons = data.signaux || [];

        // Ajouter les infos de DrainBot
        if (data.title) raisons.push('📄 Titre : ' + data.title);
        if (data.server) raisons.push('🖥️ Serveur : ' + data.server);
        if (data.status_code) raisons.push('📊 Status : ' + data.status_code);
        if (data.url_final && data.url_final !== data.url_original) {
          raisons.push('🔄 Redirection : ' + data.url_final);
        }

        SCORE_FINAL = score;
        RAISONS_FINALES = raisons;
        afficherResultat(score, raisons, true);

        // Lance les captures d'écran
        lancerCaptures(url);

        setTimeout(function() {
          if (NB_IMAGES_OK === 0) {
            var bonusScore = Math.min(SCORE_FINAL + 20, 100);
            RAISONS_FINALES.push('🚫 AUCUNE capture possible — le site BLOQUE les vérifications');
            SCORE_FINAL = bonusScore;
            afficherResultat(bonusScore, RAISONS_FINALES, true);
          }
          ajouterBoutonRapport();
        }, 25000);
      })
      .catch(function(e) {
        // Si DrainBot inaccessible, analyse locale
        console.log('Erreur DrainBot:', e);
        analyseLocale(url, zone, previewZone);
      });
  }

  function analyseLocale(url, zone, previewZone) {
    var raisons = [];
    var score = 0;
    var urlLower = url.toLowerCase();
    var parts = urlLower.replace(/^https?:\/\//, '').split('/')[0].split('.');

    var mots = ['drain', 'wallet', 'metamask', 'crypto', 'airdrop', 'claim', 'login', 'verify', 'free', 'gift', 'win', 'prize'];
    var trouves = mots.filter(function(m) { return urlLower.indexOf(m) !== -1; });
    if (trouves.length > 0) { raisons.push('⚠️ Mots sensibles : ' + trouves.join(', ')); score += 15 * trouves.length; }
    var tlds = ['.xyz', '.top', '.tk', '.ml', '.ga', '.cf', '.online', '.click'];
    if (tlds.indexOf('.' + parts[parts.length - 1]) !== -1) { raisons.push('🌍 Extension suspecte'); score += 25; }

    score = Math.min(score, 100);
    SCORE_FINAL = score;
    RAISONS_FINALES = raisons;
    afficherResultat(score, raisons, false);
    lancerCaptures(url);

    setTimeout(function() {
      if (NB_IMAGES_OK === 0) {
        SCORE_FINAL = Math.min(SCORE_FINAL + 20, 100);
        RAISONS_FINALES.push('🚫 AUCUNE capture possible');
        afficherResultat(SCORE_FINAL, RAISONS_FINALES, false);
      }
      ajouterBoutonRapport();
    }, 25000);
  }

  function afficherResultat(score, raisons, viaDrainBot) {
    var verdict, classe;
    if (score >= 70) { verdict = '🔴 DANGEREUX'; classe = 'danger'; }
    else if (score >= 40) { verdict = '🟠 SUSPECT'; classe = 'warn'; }
    else if (score >= 15) { verdict = '🟡 ATTENTION'; classe = 'warn'; }
    else { verdict = '🟢 SEMBLE OK'; classe = 'ok'; }

    var html = '<div class="result ' + classe + '">';
    if (viaDrainBot) html += '<span class="drainbot-badge">🤖 Analysé par DrainBot</span>';
    html += '<div class="score">' + score + '/100</div>';
    html += '<div class="verdict">' + verdict + '</div>';
    html += '<div class="raisons">';
    if (raisons.length > 0) for (var i = 0; i < raisons.length; i++) html += '<div>• ' + raisons[i] + '</div>';
    else html += '<div>✅ Aucune anomalie détectée</div>';
    html += '</div></div>';
    document.getElementById('zoneResultat').innerHTML = html;
  }

  function lancerCaptures(url) {
    var encoded = encodeURIComponent(url);
    var domaine = url.replace(/^https?:\/\//, '').split('/')[0].split(':')[0];
    var previewHTML = '<div class="preview">';
    previewHTML += '<h4>📸 Captures d\'écran</h4>';
    previewHTML += '<div class="shot-label"><span>1️⃣ thum.io</span><span id="s1">⏳</span></div>';
    previewHTML += '<img class="shot" id="shot1" src="https://image.thum.io/get/width/800/crop/1200/noanimate/' + url + '" onload="captureOK()" onerror="captureKO(1)" />';
    previewHTML += '<div class="shot-label"><span>2️⃣ WordPress</span><span id="s2">⏳</span></div>';
    previewHTML += '<img class="shot" id="shot2" src="https://s0.wp.com/mshots/v1/' + encoded + '?w=800" onload="captureOK()" onerror="captureKO(2)" />';
    previewHTML += '</div>';
    document.getElementById('previewZone').innerHTML = previewHTML;
  }

  function captureOK() { NB_IMAGES_OK++; }
  function captureKO(n) {
    var el = document.getElementById('s' + n);
    if (el) el.textContent = '❌';
  }

  function ajouterBoutonRapport() {
    var btn = '<button class="danger" onclick="genererRapport()">📋 GÉNÉRER UN RAPPORT DE SIGNALEMENT</button>';
    document.getElementById('previewZone').innerHTML += btn;
  }

  function genererRapport() {
    var date = new Date().toLocaleString('fr-FR');
    var verdict = SCORE_FINAL >= 70 ? 'DANGEREUX' : SCORE_FINAL >= 40 ? 'SUSPECT' : 'ATTENTION';
    var texte = '';
    texte += '=========================================\n';
    texte += '  RAPPORT DE SIGNALEMENT - ARNAQUE\n';
    texte += '=========================================\n\n';
    texte += 'Date : ' + date + '\n\n';
    texte += 'URL SIGNALEE :\n' + URL_STOCKEE + '\n\n';
    texte += 'SCORE DE RISQUE : ' + SCORE_FINAL + '/100\n';
    texte += 'VERDICT : ' + verdict + '\n\n';
    texte += 'SIGNAUX DETECTES :\n';
    for (var i = 0; i < RAISONS_FINALES.length; i++) texte += '  ' + (i+1) + '. ' + RAISONS_FINALES[i] + '\n';
    texte += '\n';
    texte += 'CONTEXTE :\n';
    texte += 'Ce lien a ete analyse par Guard (anti-arnaque) + DrainBot.\n';
    texte += 'Aucune visite n\'a ete effectuee par l\'utilisateur.\n\n';
    texte += 'DEMANDE :\n';
    texte += 'Merci de verifier ce site et de proteger les utilisateurs.\n\n';
    texte += '=========================================\n';
    texte += 'Signaler : https://www.cybercriminalite.sn\n';
    texte += '=========================================\n';

    var html = '<div class="rapport">';
    html += '<h4>📋 RAPPORT PRET</h4>';
    html += '<textarea id="rapportText" readonly>' + texte + '</textarea>';
    html += '<button onclick="copierRapport()" style="margin-top:10px">📋 COPIER</button>';
    html += '<button onclick="partagerRapport()" style="margin-top:5px">📤 PARTAGER</button>';
    html += '</div>';
    document.getElementById('previewZone').innerHTML += html;
  }

  function copierRapport() {
    var txt = document.getElementById('rapportText');
    txt.select();
    txt.setSelectionRange(0, 99999);
    try { document.execCommand('copy'); alert('✅ Copié !'); } catch (e) {
      if (navigator.clipboard) navigator.clipboard.writeText(txt.value).then(function() { alert('✅ Copié !'); });
    }
  }

  function partagerRapport() {
    var txt = document.getElementById('rapportText').value;
    if (navigator.share) navigator.share({ title: 'Rapport arnaque', text: txt }).catch(function() {});
    else alert('Utilise "Copier".');
  }
</script>
</body>
</html>
