<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dakivox</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, sans-serif; background: radial-gradient(ellipse at top, #1a0010 0%, #000308 100%); color: #e9edef; min-height: 100vh; padding: 15px; }
  .container { max-width: 500px; margin: 0 auto; }
  .header { text-align: center; padding: 15px; border: 2px solid #ff0080; border-radius: 12px; background: rgba(255, 0, 128, 0.05); margin-bottom: 15px; box-shadow: 0 0 20px rgba(255, 0, 128, 0.3); }
  .header h1 { font-size: 22px; color: #ff0080; letter-spacing: 3px; }
  .header p { font-size: 10px; color: #ff0080; opacity: 0.7; letter-spacing: 2px; margin-top: 3px; }
  input[type="text"], input[type="password"] { width: 100%; padding: 14px; border: 2px solid #ff0080; border-radius: 10px; background: #111b21; color: #e9edef; font-size: 15px; margin-bottom: 10px; }
  button { width: 100%; padding: 16px; font-size: 16px; font-weight: bold; border: none; border-radius: 10px; cursor: pointer; background: linear-gradient(135deg, #ff0080, #cc0066); color: #fff; margin-bottom: 10px; }
  button:active { transform: scale(0.97); }
  button.ghost { background: transparent; border: 2px solid #ff0080; color: #ff0080; }
  button.small { padding: 8px 12px; font-size: 12px; width: auto; margin: 0; }
  .info-box { background: rgba(255, 0, 128, 0.05); border: 1px dashed #ff0080; border-radius: 10px; padding: 12px; font-size: 12px; color: #ff0080; margin-bottom: 12px; line-height: 1.6; }
  .infos { background: #111b21; border-radius: 12px; padding: 15px; margin-top: 15px; border-left: 5px solid #ff0080; font-size: 13px; }
  .infos div { padding: 4px 0; color: #d1d7db; }
  .infos .label { color: #ff0080; font-weight: bold; }
  .code-section { background: #111b21; border-radius: 12px; padding: 15px; margin-top: 15px; border: 1px solid #ff0080; }
  .section-header { display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
  .section-header h3 { color: #ff0080; font-size: 14px; flex: 1; }
  .section-header .toggle { color: #ff0080; font-size: 18px; padding: 0 5px; }
  .code-block { background: #0a1218; border-radius: 8px; padding: 12px; font-family: monospace; font-size: 11px; color: #e9edef; white-space: pre-wrap; word-break: break-all; max-height: 400px; overflow-y: auto; margin-top: 10px; }
  .footer { text-align: center; font-size: 10px; color: #8696a0; margin-top: 20px; padding-top: 12px; border-top: 1px solid #ff0080; }
  .hidden { display: none; }
  .connected { background: rgba(0, 255, 128, 0.1); border: 1px solid #00ff80; color: #00ff80; padding: 10px; border-radius: 8px; text-align: center; margin-bottom: 15px; font-size: 13px; }
  .loading { text-align: center; color: #ff0080; padding: 20px; font-size: 14px; }
  .empty { text-align: center; color: #8696a0; padding: 15px; font-size: 13px; font-style: italic; }
</style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>⚡ DAKIVOX</h1>
      <p>EXTRACTION DE CODE - ACCÈS PRIVÉ</p>
    </div>

    <div id="loginView">
      <div class="info-box">🔐 Accès réservé. Entre le mot de passe Dakivox.</div>
      <input type="password" id="passwordInput" placeholder="Mot de passe..." />
      <button onclick="login()">🔓 Déverrouiller</button>
      <div id="loginError" style="color:#ff3366;text-align:center;font-size:13px;margin-top:10px;"></div>
    </div>

    <div id="mainView" class="hidden">
      <div class="connected">✅ Connecté à Dakivox — Session active</div>
      <div class="info-box">📄 Colle un lien. Dakivox va extraire son HTML, CSS, JS et ressources.</div>
      <input type="text" id="urlInput" placeholder="https://site-a-analyser.com/..." />
      <button onclick="extraireCode()">📄 Extraire le code</button>
      <button class="ghost" onclick="logout()">🔒 Se déconnecter</button>
      <div id="loadingZone"></div>
      <div id="infosZone"></div>
      <div id="codeZone"></div>
    </div>

    <div class="footer">⚡ DAKIVOX - Extraction de code</div>
  </div>

<script>
  var DRAINBOT_URL = 'https://drainbot.onrender.com';
  var MOT_DE_PASSE = '';

  function login() {
    var pwd = document.getElementById('passwordInput').value.trim();
    if (!pwd) { document.getElementById('loginError').textContent = 'Entre un mot de passe'; return; }
    fetch(DRAINBOT_URL + '/code?url=https://example.com', { headers: { 'Authorization': 'Bearer ' + pwd } })
      .then(function(r) {
        if (r.status === 401) throw new Error('Mot de passe incorrect');
        return r.json();
      })
      .then(function(data) {
        MOT_DE_PASSE = pwd;
        localStorage.setItem('dakivox_pwd', pwd);
        document.getElementById('loginView').classList.add('hidden');
        document.getElementById('mainView').classList.remove('hidden');
      })
      .catch(function(e) { document.getElementById('loginError').textContent = '❌ ' + e.message; });
  }

  function logout() {
    MOT_DE_PASSE = '';
    localStorage.removeItem('dakivox_pwd');
    location.reload();
  }

  function extraireCode() {
    var url = document.getElementById('urlInput').value.trim();
    if (!url) { alert('Colle un lien'); return; }
    if (!url.startsWith('http')) url = 'http://' + url;

    document.getElementById('loadingZone').innerHTML = '<div class="loading">⏳ Extraction du code en cours... (10-30 sec)</div>';
    document.getElementById('infosZone').innerHTML = '';
    document.getElementById('codeZone').innerHTML = '';

    fetch(DRAINBOT_URL + '/code?url=' + encodeURIComponent(url), {
      headers: { 'Authorization': 'Bearer ' + MOT_DE_PASSE }
    })
      .then(function(r) {
        if (r.status === 401) throw new Error('Session expiree');
        return r.json();
      })
      .then(function(data) {
        document.getElementById('loadingZone').innerHTML = '';
        if (data.error) {
          document.getElementById('infosZone').innerHTML = '<div class="infos"><div style="color:#ff3366">❌ Erreur : ' + data.error + '</div></div>';
          // On essaie quand meme d'afficher le code si dispo
        }
        afficherInfos(data);
        afficherCode(data.code);
      })
      .catch(function(e) {
        document.getElementById('loadingZone').innerHTML = '';
        document.getElementById('infosZone').innerHTML = '<div class="infos"><div style="color:#ff3366">❌ ' + e.message + '</div></div>';
      });
  }

  function afficherInfos(data) {
    var html = '<div class="infos">';
    html += '<div><span class="label">URL demandee :</span> ' + (data.url_original || '—') + '</div>';
    if (data.url_final && data.url_final !== data.url_original) {
      html += '<div><span class="label">URL finale :</span> ' + data.url_final + '</div>';
    }
    if (data.redirect_to) {
      html += '<div><span class="label">Redirection vers :</span> <span style="color:#ff3366">' + data.redirect_to + '</span></div>';
    }
    html += '<div><span class="label">Status :</span> ' + (data.status_code || '—') + '</div>';
    html += '<div><span class="label">Taille HTML :</span> ' + (data.html_size || 0) + ' caracteres</div>';
    html += '<div><span class="label">Temps :</span> ' + (data.time_ms || 0) + ' ms</div>';
    html += '</div>';
    document.getElementById('infosZone').innerHTML = html;
  }

  function afficherCode(code) {
    if (!code) {
      document.getElementById('codeZone').innerHTML = '<div class="empty">Aucun code extrait</div>';
      return;
    }
    var html = '';

    // HTML COMPLET
    var htmlComplet = code.html_complet || '';
    html += creerSection('📄 HTML COMPLET (' + htmlComplet.length + ' caracteres)', 
      htmlComplet ? escapeHtml(htmlComplet.substring(0, 30000)) + (htmlComplet.length > 30000 ? '\n\n... [TRONQUE - ' + (htmlComplet.length - 30000) + ' caracteres restants]' : '') : 'Aucun HTML recupere',
      true);

    // SCRIPTS
    if (code.scripts && code.scripts.length > 0) {
      var scriptContent = '';
      code.scripts.forEach(function(s, i) {
        scriptContent += '--- SCRIPT ' + (i+1) + ' (' + s.type + ') ---\n';
        if (s.src) scriptContent += 'Source : ' + s.src + '\n';
        if (s.contenu) scriptContent += s.contenu + '\n';
        if (s.taille) scriptContent += 'Taille : ' + s.taille + ' caracteres\n';
        scriptContent += '\n';
      });
      html += creerSection('⚡ SCRIPTS (' + code.scripts.length + ')', escapeHtml(scriptContent), false);
    }

    // STYLES
    if (code.styles && code.styles.length > 0) {
      var styleContent = '';
      code.styles.forEach(function(s, i) {
        styleContent += '--- STYLE ' + (i+1) + ' (' + s.type + ') ---\n';
        if (s.href) styleContent += 'Source : ' + s.href + '\n';
        if (s.contenu) styleContent += s.contenu + '\n';
        if (s.taille) styleContent += 'Taille : ' + s.taille + ' caracteres\n';
        styleContent += '\n';
      });
      html += creerSection('🎨 STYLES CSS (' + code.styles.length + ')', escapeHtml(styleContent), false);
    }

    // FORMULAIRES
    if (code.formulaires && code.formulaires.length > 0) {
      var formContent = '';
      code.formulaires.forEach(function(f, i) {
        formContent += '--- FORMULAIRE ' + (i+1) + ' ---\n';
        formContent += 'Action : ' + f.action + '\n';
        formContent += 'Methode : ' + f.method + '\n';
        f.inputs.forEach(function(inp) { formContent += '  Input [' + inp.type + '] : ' + inp.name + '\n'; });
        formContent += '\n';
      });
      html += creerSection('📝 FORMULAIRES (' + code.formulaires.length + ')', escapeHtml(formContent), false);
    }

    // RESSOURCES
    if (code.ressources && code.ressources.length > 0) {
      var resContent = '';
      code.ressources.forEach(function(r) { resContent += '[' + r.type + '] ' + r.url + '\n'; });
      html += creerSection('🌐 RESSOURCES (' + code.ressources.length + ')', escapeHtml(resContent), false);
    }

    // META
    if (code.meta && code.meta.length > 0) {
      var metaContent = '';
      code.meta.forEach(function(m) { metaContent += m.name + ' : ' + m.content + '\n'; });
      html += creerSection('🏷️ META (' + code.meta.length + ')', escapeHtml(metaContent), false);
    }

    document.getElementById('codeZone').innerHTML = html;
  }

  function creerSection(titre, contenu, ouvertParDefaut) {
    var style = ouvertParDefaut ? 'display:block' : 'display:none';
    var icon = ouvertParDefaut ? '▼' : '▶';
    return '<div class="code-section">' +
      '<div class="section-header" onclick="toggleSection(this)">' +
        '<h3>' + titre + '</h3>' +
        '<span class="toggle">' + icon + '</span>' +
      '</div>' +
      '<div class="code-block" style="' + style + '">' + contenu + '</div>' +
    '</div>';
  }

  function toggleSection(el) {
    var block = el.nextElementSibling;
    var icon = el.querySelector('.toggle');
    if (block.style.display === 'none') {
      block.style.display = 'block';
      icon.textContent = '▼';
    } else {
      block.style.display = 'none';
      icon.textContent = '▶';
    }
  }

  function escapeHtml(text) {
    var div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  window.onload = function() {
    var saved = localStorage.getItem('dakivox_pwd');
    if (saved) {
      document.getElementById('passwordInput').value = saved;
      fetch(DRAINBOT_URL + '/code?url=https://example.com', { headers: { 'Authorization': 'Bearer ' + saved } })
        .then(function(r) {
          if (r.status !== 401) {
            MOT_DE_PASSE = saved;
            document.getElementById('loginView').classList.add('hidden');
            document.getElementById('mainView').classList.remove('hidden');
          }
        }).catch(function() {});
    }
  };
</script>
</body>
</html>
